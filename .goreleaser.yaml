# GoReleaser configuration for claude-notifier
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: claude-notifier
    main: ./cmd/claude-notifier
    binary: claude-notifier
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/jeroendee/claude-notifier/internal/version.Version={{.Version}}
      - -X github.com/jeroendee/claude-notifier/internal/version.Commit={{.Commit}}
      - -X github.com/jeroendee/claude-notifier/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: jeroendee
    name: claude-notifier
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
